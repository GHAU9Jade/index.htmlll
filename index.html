<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Skill Test</title>
    
</head>
<body>
   <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSffsm2n4xf-Ake_7FjbIElN4zOydP5HGxF899j-8bZJQ&s=10
        " alt="OBMC Logo" width="50" height="" class="me-3 bg-white rounded-circle p-1">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Enroll now</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Homepage</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>
            </div> 
        </div>
    </nav>  
  <div class="text-center mb-4 page-enrollment">
      <div class="d-inline-flex align-items-center justify-content-center mb-2">
        <h1 class="h2">OBMC Enrollment Form</h1>
      </div>
    </div>
      <div class="row justify-content-center">
      <div class="col-md-6 transparent-box">

  <form>
    <h4>Student Information</h4>
    <div class="mb-3 mt-3">
      <label for="Name">Name:</label>
      <input type="text" class="form-control" id="Name" placeholder="Enter Name" name="Name">
    </div>
    <div class="row">
        <div class="mb-3 mt-3">
          <label for="birthDate" class="form-label">Birth Date</label>
          <input type="date" class="form-control" id="birthDate">
        </div>
    </div>
    <div class="mb-3 mt-3">
      <label for="gender" class="form-label">Gender</label>
          <select class="form-select" id="gender">
            <option selected disabled>Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
    </div>
    <div class="mb-3 mt-3">
          <label for="gradeLevel" class="form-label">Grade Level</label>
          <select class="form-select" id="gradeLevel">
              <option selected disabled>Select...</option>
              <option value="7">Junior Casa</option>
              <option value="7">Advanced Casa</option>
              <option value="7">Casa</option>
              <option value="7">Grade 1</option>
              <option value="7">Grade 2</option>
              <option value="7">Grade 3</option>
              <option value="7">Grade 4</option>
              <option value="7">Grade 5</option>
              <option value="7">Grade 6</option>
              <option value="7">Grade 7</option>
              <option value="8">Grade 8</option>
              <option value="9">Grade 9</option>
              <option value="10">Grade 10</option>
              <option value="7">Grade 11</option>
              <option value="7">Grade 12</option>
          </select>
        </div>
    <h4>Contact Details</h4>
      <br>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="student@example.com">
      </div>
      <div class="mb-3">
        <label for="contact" class="form-label">Contact Number</label>
        <input type="tel" class="form-control" id="contact" placeholder="0912-345-6789">
      </div>
      <br>
      <h4>Other Information</h4>
      <br>
      <label class="form-label">Mode of Learning</label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="learningMode" id="online">
        <label class="form-check-label" for="online">Online</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="learningMode" id="f2f">
        <label class="form-check-label" for="f2f">Face-to-Face</label>
      </div>
    <input type="submit" value="Submit Review">
   </form>
</div>
</body>
</html>
